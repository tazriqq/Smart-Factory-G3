# Telegraf: listens to the board's MQTT topics and writes every message to PostgreSQL (the main store)
# and the live signal also to InfluxDB (for Grafana). All values come from ../.env (through docker-compose.yml).
#
# The board's JSON line  {"pot":[..4],"run":[..4],"al":0,"cnt":[..4],"good":n,"rej":n,"ms":n,"route":"12-34","out":[..2],"qg":[..2],"qr":[..2]}
# becomes one point in measurement "board" with the fields
#   pot_0..pot_3  run_0..run_3  al  cnt_0..cnt_3  good  rej  ms      (machine 1 = _0 ... machine 4 = _3)
#   route  out_0 out_1  qg_0 qg_1  qr_0 qr_1                         (product A = _0, B = _1)
# and the tag  line = LINE_ID.  The status topic ("online" / "offline") goes to "board_status".
# The board also sends the rows OEE is worked out from (tables in ../postgres/schema.sql):
#   events   {"machine":1,"event":"part","product":"A","age_ms":0}     ("route":"12-34" on a route change)
#   minutes  {"machine":1,"product":"A","run_s":55,"stop_s":5,"alarm_s":0,"parts":1,"speed_pct":100,"age_ms":0}
# age_ms = how long the row waited on the board (e.g. while Wi-Fi was down), so the time is right
# without the board needing the internet for its clock.

[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

# the board's data line
[[inputs.mqtt_consumer]]
  servers = ["${MQTT_SERVER}"]
  topics = ["${MQTT_TOPIC_BOARD}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "dpx-telegraf-board"
  qos = 0
  connection_timeout = "30s"
  name_override = "board"
  topic_tag = ""
  data_format = "json"
  json_string_fields = ["route"]
  [inputs.mqtt_consumer.tags]
    line = "${LINE_ID}"

# online / offline, kept by the broker (the ESP32's last will)
[[inputs.mqtt_consumer]]
  servers = ["${MQTT_SERVER}"]
  topics = ["${MQTT_TOPIC_STATUS}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "dpx-telegraf-status"
  qos = 0
  connection_timeout = "30s"
  name_override = "board_status"
  topic_tag = ""
  data_format = "value"
  data_type = "string"
  [inputs.mqtt_consumer.tags]
    line = "${LINE_ID}"

# rows for OEE (events, minutes)
[[inputs.mqtt_consumer]]
  servers = ["${MQTT_SERVER}"]
  topics = ["${MQTT_TOPIC_EVENTS}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "dpx-telegraf-events"
  qos = 0
  connection_timeout = "30s"
  name_override = "events"
  topic_tag = ""
  data_format = "json"
  json_string_fields = ["event", "product", "route", "source"]
  [inputs.mqtt_consumer.tags]
    line = "${LINE_ID}"

[[inputs.mqtt_consumer]]
  servers = ["${MQTT_SERVER}"]
  topics = ["${MQTT_TOPIC_MINUTES}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "dpx-telegraf-minutes"
  qos = 0
  connection_timeout = "30s"
  name_override = "minutes"
  topic_tag = ""
  data_format = "json"
  json_string_fields = ["product"]
  [inputs.mqtt_consumer.tags]
    line = "${LINE_ID}"

# events / minutes: move the time back by age_ms, and store whole numbers as integers
[[processors.starlark]]
  namepass = ["events", "minutes"]
  source = '''
def apply(metric):
    age = metric.fields.pop("age_ms", 0)
    metric.time = metric.time - int(age) * 1000000
    for k, v in list(metric.fields.items()):
        if type(v) == "float":
            metric.fields[k] = int(v)
    return metric
'''

# the main store: tables made by ../postgres/schema.sql
[[outputs.postgresql]]
  namepass = ["board", "board_status", "events", "minutes"]
  connection = "host=timescaledb port=5432 dbname=${PG_DB} user=telegraf password=${PG_TELEGRAF_PASS} sslmode=disable"

# InfluxDB keeps the live signal for Grafana
[[outputs.influxdb_v2]]
  namepass = ["board", "board_status"]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
