# nginx: serves the website, and passes /mqtt on to Mosquitto's WebSocket listener,
# so a single address (e.g. https://oee.example.com through the Cloudflare tunnel) gives both
# the page and its live data: the page then uses wss://<that address>/mqtt as its broker.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the page is ~3 MB (machine drawings); gzip makes it ~0.7 MB, which matters over the tunnel
    gzip on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/css application/javascript image/svg+xml;
    # the browser checks for a newer copy (ETag) instead of downloading it again
    add_header Cache-Control "no-cache";

    location /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
