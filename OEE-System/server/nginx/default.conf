# nginx: serves the website, and passes /mqtt on to Mosquitto's WebSocket listener,
# so a single address (e.g. https://oee.example.com through the Cloudflare tunnel) gives both
# the page and its live data: the page then uses wss://<that address>/mqtt as its broker.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the page is ~3 MB (machine drawings); gzip makes it ~0.7 MB, which matters over the tunnel
    gzip on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/css application/javascript image/svg+xml;
    # the browser checks for a newer copy (ETag) instead of downloading it again
    add_header Cache-Control "no-cache";

    # control.<domain> opens the line's control page
    location = / {
        if ($host ~* ^control\.) { rewrite ^ /control.html last; }
    }

    # the dashboard's live data: Mosquitto's read-only listener, no login (see mosquitto.conf)
    location /mqtt-view {
        proxy_pass http://mosquitto:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # pairing codes: a 5-character code logs another device in to the control page (server/control-hub)
    location /pair/ {
        resolver 127.0.0.11 valid=10s;     # Docker's DNS: find the hub again after it is recreated
        set $hub http://control-hub:8090;
        proxy_pass $hub;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store";
    }

    location /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
