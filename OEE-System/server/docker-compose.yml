# Smart factory server: Mosquitto (MQTT) -> Telegraf -> PostgreSQL/TimescaleDB (main store) and InfluxDB -> Grafana,
# plus the website, and sheets-sync (OEE summary -> Google Sheet)
# Start:  docker compose up -d        (settings and passwords come from .env next to this file)
# Open:   website  http://<this computer>:8080     Grafana  http://<this computer>:3000
#         MQTT for the ESP32  <this computer>:1883   ·   WebSocket for the website  ws://<this computer>:9001
#         PostgreSQL  <this computer>:5432  (Claude's MCP logs in as the read-only user "reader")
#         from anywhere: docker compose --profile tunnel up -d   (Cloudflare Tunnel, CLOUDFLARE_TUNNEL_TOKEN in .env)
#         (all ports can be changed in .env)
# Runs on a PC (x86_64) or a Raspberry Pi 4/5 with a 64-bit OS (arm64).

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/acl_view:/mosquitto/config/acl_view:ro
      - mosquitto-data:/mosquitto/data
    environment:
      MQTT_ESP32_PASS: ${MQTT_ESP32_PASS}
      MQTT_WEB_PASS: ${MQTT_WEB_PASS}
      MQTT_HUB_PASS: ${MQTT_HUB_PASS}
    # build the password file from .env, copy the ACL with the owner / mode mosquitto wants, then start
    command:
      - sh
      - -c
      - |
        set -e
        touch /mosquitto/passwd && chmod 0700 /mosquitto/passwd
        mosquitto_passwd -b /mosquitto/passwd esp32 "$$MQTT_ESP32_PASS"
        mosquitto_passwd -b /mosquitto/passwd web "$$MQTT_WEB_PASS"
        mosquitto_passwd -b /mosquitto/passwd hub "$$MQTT_HUB_PASS"
        cp /mosquitto/config/acl /mosquitto/acl && chmod 0700 /mosquitto/acl
        cp /mosquitto/config/acl_view /mosquitto/acl_view && chmod 0700 /mosquitto/acl_view
        chown mosquitto:mosquitto /mosquitto/passwd /mosquitto/acl /mosquitto/acl_view
        exec mosquitto -c /mosquitto/config/mosquitto.conf

  web:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ../website:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # Cloudflare Tunnel: opens the website (and Grafana) from anywhere without opening router ports.
  # Starts only with --profile tunnel. The public hostnames are set in the Cloudflare dashboard:
  #   oee.<your domain>      -> http://web:80        (the page + its MQTT at /mqtt)
  #   grafana.<your domain>  -> http://grafana:3000
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    profiles: [tunnel]
    depends_on:
      - web
      - grafana
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  influxdb:
    image: influxdb:2.7.10
    restart: unless-stopped
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      # used only on the very first start, to create the user, org, bucket and token
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # the main store; postgres/init.sh makes the tables, views and users on the very first start
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./postgres/schema.sql:/factory/schema.sql:ro
    environment:
      POSTGRES_USER: ${PG_ADMIN_USER}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      PG_TELEGRAF_PASS: ${PG_TELEGRAF_PASS}
      PG_READER_PASS: ${PG_READER_PASS}
      TZ: Asia/Bangkok
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12

  # every SHEETS_EVERY_MIN minutes: OEE summary from the database -> Google Sheet
  # the one copy of the control page's state: takes the pages' commands in order, first one wins
  control-hub:
    build: ./control-hub
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_USER: hub
      MQTT_PASS: ${MQTT_HUB_PASS}
      MQTT_WEB_PASS: ${MQTT_WEB_PASS}   # handed out once per pairing code (GET /pair/<code>)

  sheets-sync:
    build: ./sheets-sync
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      DATABASE_URI: postgresql://reader:${PG_READER_PASS}@timescaledb:5432/${PG_DB}
      SHEETS_URL: ${SHEETS_URL}
      SHEETS_KEY: ${SHEETS_KEY}
      SHEETS_EVERY_MIN: ${SHEETS_EVERY_MIN:-15}
      SHEETS_HOURLY_DAYS: ${SHEETS_HOURLY_DAYS:-14}
      SHEETS_EVENTS_ROWS: ${SHEETS_EVENTS_ROWS:-500}
      SHEETS_EVENTS_GAP_S: ${SHEETS_EVENTS_GAP_S:-10}
      SHEETS_MAX_ROWS: ${SHEETS_MAX_ROWS:-1000}

  telegraf:
    image: telegraf:1.32.3
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
        restart: true   # Telegraf doesn't always get back on after the broker restarts: restart it too
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      MQTT_SERVER: ${MQTT_SERVER}
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      MQTT_TOPIC_BOARD: ${MQTT_TOPIC_BOARD}
      MQTT_TOPIC_STATUS: ${MQTT_TOPIC_STATUS}
      MQTT_TOPIC_EVENTS: ${MQTT_TOPIC_EVENTS}
      MQTT_TOPIC_MINUTES: ${MQTT_TOPIC_MINUTES}
      LINE_ID: ${LINE_ID}
      PG_DB: ${PG_DB}
      PG_TELEGRAF_PASS: ${PG_TELEGRAF_PASS}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smart-factory.json
      GF_USERS_DEFAULT_THEME: light
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}

volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
  timescaledb-data:
