# Mosquitto: the MQTT broker for the line, on this computer
#   1883  MQTT        the ESP32 and Telegraf                        (login: esp32 / web)
#   9001  WebSocket   the control page (ws://<this computer>:9001)  (login: web)
#   9002  WebSocket   the dashboard, read only, no login - only through nginx at /mqtt-view, not opened on this computer
# Users and passwords come from ../.env (made into a password file when the container starts).

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# each listener has its own login rules below
per_listener_settings true

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/acl

listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/acl

listener 9002
protocol websockets
allow_anonymous true
acl_file /mosquitto/acl_view
