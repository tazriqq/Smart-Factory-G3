# Mosquitto: the MQTT broker for the line, on this computer
#   1883  MQTT        the ESP32 and Telegraf
#   9001  WebSocket   the website (ws://<this computer>:9001)
# Users and passwords come from ../.env (made into a password file when the container starts).

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/acl

listener 1883
protocol mqtt

listener 9001
protocol websockets
